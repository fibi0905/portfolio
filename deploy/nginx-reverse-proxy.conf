# Nginx Reverse Proxy (Raspberry Pi)
# Sostituisci 192.168.1.20 con l'IP della CT LXC che esegue il portfolio.

server {
    listen 80;
    server_name cloudnic.cv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cloudnic.cv;

    ssl_certificate     /etc/letsencrypt/live/cloudnic.cv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudnic.cv/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32k;

    location / {
        proxy_pass http://192.168.1.20:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
